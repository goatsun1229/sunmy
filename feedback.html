      <h1>反馈方式</h1>
      <p>打开应用后点击“反馈”按钮，它会自动复制反馈模板。请把模板内容连同截图或录屏发给我们处理。</p>
      <p>建议包含：电脑系统、是否能打开、是否能退出、遇到的问题、复现步骤、截图或录屏。</p>
      <section class="doc-section">
        <h2>反馈模板</h2>
        <p>系统版本、下载文件名、是否能打开、是否能退出、遇到的问题、复现步骤、截图或录屏、希望增加的功能。</p>
      </section>
      <p><a href="./index.html">返回首页</a></p>
    </main>
