      <h1>隐私政策</h1>
      <p>码伴 PixelPal 会在本机保存宠物名、主人名、提醒、缩放和智能陪伴开关。DeepSeek API Key 仅在你主动填写时保存到本机。</p>
      <p>应用会尝试识别当前前台应用名称或窗口标题，用来切换桌宠状态。它不会读取文件内容、聊天内容或浏览器历史。</p>
      <p>如果你使用天气或 DeepSeek 问答，会向对应第三方服务发起请求。当前 Beta 版本没有账号系统和云端数据库。</p>
      <p><a href="./index.html">返回首页</a></p>
    </main>
